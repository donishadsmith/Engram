[workspace]
members = ["frontend", "gb", "gba", "psx", "shared"]
resolver = "3"

[workspace.dependencies]
shared = { path = "shared" }
gb = { path = "gb" }
gba = { path = "gba" }
egui = "0.31.1"
egui-macroquad = { version = "0.17.3", default-features = false }
macroquad = "0.4.16"
rfd = "0.17.2"
chrono = "0.4.45"
egui_plot = "0.32.0"
cpal = "0.18.2"
rtrb = "0.4.0"
gif = "0.14.2"
dirs = "7.0.0"
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
egui_code_editor = "=0.2.13"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
serde_json = "1"
spin_sleep = "1.3.3"
gilrs = "0.11.2"
egui-notify = "0.19"
lz4_flex = "0.14.0" # probably need to incorporate now due to psx
postcard = { version = "1.1.3", features = ["alloc"] }
serde_bytes = "0.11.19"

[profile.dev]
opt-level = 1
