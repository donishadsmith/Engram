[package]
name = "engram_gb"
version = "0.1.1"
edition = "2024"
authors = ["Donisha Smith <donishasmith@outlook.com>"]
license-file = "LICENSE"

[dependencies]
macroquad = { version = "0.4", default-features = false }
rfd = "0.17"
chrono = "0.4"
cpal = "0.18.1"
rtrb = "0.3.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
